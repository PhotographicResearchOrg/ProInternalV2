<div class="grid">



  <div class="col-12">
    <!-- Toggle Button -->
    <div style="margin-bottom: 1.0rem;">
      <button pButton
              type="button"
              icon="{{ isShippingCardCollapsed ? 'pi pi-chevron-down' : 'pi pi-chevron-up' }}"
              class="p-button-text"
              (click)="isShippingCardCollapsed = !isShippingCardCollapsed">
        {{ isShippingCardCollapsed ? 'Show' : 'Hide' }} BRM Shipping Errors
      </button>
    </div>


    <p-card *ngIf="!isShippingCardCollapsed" header="BRM Shipping Errors" class="mt-2">
      <app-shippingerrorbrm (errorCountChanged)="brmShippingErrorCount = $event"></app-shippingerrorbrm>

      <p *ngIf="brmShippingErrorCount === 0" class="mt-3 text-center text-500">
        No shipping errors to process.
      </p>
    </p-card>


  </div>



  <div class="col-12">
    <!-- Toggle button with spacing above -->
    <div style="margin-bottom: 1.0rem;">
      <button pButton
              type="button"
              icon="{{ isHubspotCardCollapsed ? 'pi pi-chevron-down' : 'pi pi-chevron-up' }}"
              class="p-button-text"
              (click)="isHubspotCardCollapsed = !isHubspotCardCollapsed">
        {{ isHubspotCardCollapsed ? 'Show' : 'Hide' }} Company Management
      </button>
    </div>

    <!-- Collapsible card -->
    <p-card *ngIf="!isHubspotCardCollapsed" header="HubSpot Company Management" class="mt-2">
      <app-hubspot-company (filterByAccountNumbers)="onAccountFilter($event)"></app-hubspot-company>
    </p-card>
  </div>







  <!-- Instant Rebate Declines Card (Full Width) -->
  <div class="col-12">
    <p-card>
      <ng-template pTemplate="header">
        <div class="text-900 text-xl font-semibold">
          Instant Rebate Declines (Support Needed)
        </div>
        <div class="mt-3">
          <button pButton
                  label="Toggle Status"
                  icon="pi pi-sync"
                  class="p-button-sm p-button-text"
                  (click)="toggleStatusFilter()">
          </button>
          <p-tag [value]="statusFilter === 3 ? 'Actionable' : 'Information'"
                 [severity]="statusFilter === 3 ? 'warning' : 'info'"
                 class="ml-2">
          </p-tag>
        </div>
      </ng-template>

      <div class="flex align-items-center mb-3" style="max-width: 100%;">
        <div class="p-input-icon-left" style="flex: 1; max-width: 400px;">
          <i class="pi pi-search"></i>
          <input pInputText
                 type="text"
                 (input)="onSearch($event)"
                 placeholder="Search..."
                 class="w-full"
                 style="border-radius: 2rem" />
        </div>
        <!--<button pButton
                pRipple
                icon="pi pi-cloud-download"
                class="p-button-rounded ml-3"
                (click)="exportData()">
        </button>-->
      </div>

      <app-ir-declines-table #declinesTable
                             [declines]="declinedIRs"
                             [columns]="IRDeclinecols"
                             [globalFilterFields]="['orderID','processDate','rejectReason','memberID','model', 'total']"
                             [accountNumberFilter]="hubspotAccountNumbers"
                             (actionCompleted)="refreshNotifications()">
      </app-ir-declines-table>

    </p-card>
  </div>
</div>
