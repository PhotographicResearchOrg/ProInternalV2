<div class="grid">
  <div *ngFor="let metric of PatronageUploads" class="col-12 md:col-6 lg:col-3">
    <div class="card h-full">
      <div class="flex align-items-center justify-content-between mb-3">
        <span class="text-900 text-xl font-semibold">Account {{metric.accountID}}</span>
      </div>
      <div>
        <div ngClass="bg-green-100" class="border-round" style="height: 6px">
          <div ngClass="bg-green-500" class="h-full border-round" [style.width]="getMetricPercentage(metric)"></div>
        </div>
        <span class="text-sm text-color-secondary mt-1 d-block">{{ getMetricPercentage(metric) }} of total</span>

        <div class="flex align-items-center justify-content-between">
          <span class="text-900 mt-3 text-md font-medium">{{metric.totalValue | currency}}</span>
          <span class="text-900 mt-3 text-md font-medium">{{metric.dateLoaded | date}}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="col-12 md:col-6 lg:col-12">
    <div class="card h-full">
      <app-file-uploader mode="patronage" (reload)="onReload()"></app-file-uploader>
    </div>
  </div>

  <div class="col-14 md:col-9 xl:col-12">
    <div class="card">
      <div class="text-900 text-xl font-semibold mb-3">Patronage Summary Uploads</div>
      <p-table responsiveLayout="scroll" #dt [value]="PatronageHistorical" [rows]="8" [paginator]="true">
        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id" style="min-width:2rem" class="white-space-nowrap">Batch ID <p-sortIcon field="id"></p-sortIcon></th>
            <th style="min-width:2rem" class="white-space-nowrap">Public</th>
            <th pSortableColumn="issueDate" style="min-width:2rem" class="white-space-nowrap">Loaded Date <p-sortIcon field="issueDate"></p-sortIcon></th>
            <th pSortableColumn="totalAmount" style="min-width:2rem" class="white-space-nowrap">Total Value <p-sortIcon field="totalAmount"></p-sortIcon></th>
            <th style="width:8rem"></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-patronage>
          <tr>
            <td>
              <div class="flex align-items-center">
                <i class="text-xl text-primary mr-2 pi pi-key"></i>
                <span>{{patronage.id}}</span>
              </div>
            </td>
            <td>
              <p-inputSwitch (onChange)="Activate(patronage.id)" [(ngModel)]="patronage.active"></p-inputSwitch>
            </td>
            <td>
              <span>{{patronage.issueDate | date}}</span>
            </td>
            <td>
              <span>{{patronage.totalAmount | currency}}</span>
            </td>
            <td class="text-center">
              <button (click)="Delete(patronage)" pButton pRipple icon="pi pi-times" class="p-button-danger p-button-text p-button-rounded mr-2"></button>
              <button (click)="Download(patronage)" pButton pRipple icon="pi pi-file-excel" class="p-button-text p-button-rounded"></button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
