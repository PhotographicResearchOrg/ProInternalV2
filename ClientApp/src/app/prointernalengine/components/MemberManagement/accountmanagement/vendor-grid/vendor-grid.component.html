<!-- src/app/accountmanagement/vendor-grid/vendor-grid.component.html -->

<p-toast></p-toast>

<p-table [value]="vendors"
         [loading]="loading"
         [paginator]="true"
         [rows]="50"
         [rowsPerPageOptions]="[50, 100, 500]"
         [responsiveLayout]="'scroll'"
         [resizableColumns]="true"
         [scrollable]="true"
         scrollHeight="500px">

  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Street</th>
      <th>City | State</th>
      <th>Zip</th>
      <th>Phone</th>
      <th>Short Name</th>
      <th>On Web</th>
      <th>Actions</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-vendor>
    <tr>
      <td>{{ vendor.name }}</td>
      <td>{{ vendor.street }}</td>
      <td>{{ vendor.cityState }}</td>
      <td>{{ vendor.zip }}</td>
      <td>{{ vendor.phone }}</td>
      <td>{{ vendor.shortName }}</td>
      <td>{{ vendor.onWeb }}</td>
      <td>
        <button pButton label="Toggle" icon="pi pi-refresh"
                class="p-button-sm"
                (click)="toggleWebStatus(vendor)">
        </button>
      </td>
    </tr>
  </ng-template>

</p-table>
