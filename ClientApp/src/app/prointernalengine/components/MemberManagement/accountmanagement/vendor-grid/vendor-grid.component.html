<p-toast></p-toast>
<div class="p-grid p-align-center p-mb-3" style="max-width: 100%; overflow-x: hidden;">
    <div class="p-col-12 p-md-4 py-2">
      <span class="p-input-icon-left w-full">
        <i class="pi pi-search"></i>
        <input pInputText
               type="text"
               (input)="onGlobalFilter(dtVendors, $event)"
               placeholder="Search vendors..."
               class="w-full"
               style="border-radius: 2rem" />
      </span>
    </div>

    <!-- MultiSelect filter -->
    <div class="p-col-12 p-md-4 py-2">
      <p-multiSelect appendTo="body"
                     [options]="visibilityOptions"
                     [(ngModel)]="selectedVisibility"
                     defaultLabel="Filter by visibility"
                     display="chip"
                     placeholder="Select visibility"
                     (onChange)="applyFilter()"
                     [style.width.%]="100"
                     [style.min-width.px]="0">

        <ng-template let-option pTemplate="item">
          <span [ngClass]="getVisibilityChipClass(option.value)" class="custom-chip">
            {{ option.label }}
          </span>
        </ng-template>
        <ng-template let-selectedOption pTemplate="selectedItem">
          <span [ngClass]="getVisibilityChipClass(selectedOption.value)" class="custom-chip">
            {{ selectedOption.label }}
          </span>
        </ng-template>
      </p-multiSelect>
    </div>



    <!-- Export buttons -->
    <div class="p-col-12 p-md-4 flex justify-content-md-end gap-2 py-3" style="flex-wrap: nowrap;">
      <button pButton
              icon="pi pi-file-excel"
              label="Export Vendors"
              class="p-button-sm w-auto flex-grow-0"
              (click)="exportVendors()"
              [loading]="exporting"
              [disabled]="exporting">
      </button>
    </div>
  </div>

  <p-table #dtVendors
           [value]="vendors"
           [loading]="loading"
           [paginator]="true"
           [rows]="50"
           [rowsPerPageOptions]="[50, 100, 500]"
           [responsiveLayout]="'scroll'"
           [resizableColumns]="true"
           [scrollable]="true"
           scrollHeight="500px"
           dataKey="id"
           [globalFilterFields]="['name', 'street', 'cityState', 'zip', 'phone', 'shortName', 'onWeb']"
           [filters]="{}"
           [showCurrentPageReport]="true"
           currentPageReportTemplate="Showing {first} to {last} of {totalRecords}">

    <ng-template pTemplate="header">

      <tr>
        <th>Image</th>
        <th pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
        <th pSortableColumn="street">Street <p-sortIcon field="street"></p-sortIcon></th>
        <th pSortableColumn="cityState">City | State <p-sortIcon field="cityState"></p-sortIcon></th>
        <th pSortableColumn="zip">Zip <p-sortIcon field="zip"></p-sortIcon></th>
        <th pSortableColumn="phone">Phone <p-sortIcon field="phone"></p-sortIcon></th>
        <th pSortableColumn="shortName">Short Name <p-sortIcon field="shortName"></p-sortIcon></th>
        <th pSortableColumn="onWeb">On Web <p-sortIcon field="onWeb"></p-sortIcon></th>
        <th>Actions</th>
      </tr>

    </ng-template>

    <ng-template pTemplate="body" let-vendor>
      <tr class="vendor-row" (dblclick)="openVendor(vendor)">
        <td>
          <div class="avatar-container">
            <div (drop)="onImageDrop($event, vendor)"
                 (dragover)="onDragOver($event)"
                 pTooltip="Drag and drop to update or upload image"
                 tooltipPosition="top">

              <img *ngIf="vendor.imageUrl && uploadingVendor !== vendor.id"
                   [src]="vendor.imageUrl"
                   class="rounded-circle shadow-sm" />



              <div *ngIf="uploadingVendor === vendor.id" class="upload-spinner">
                <i class="pi pi-spin pi-spinner" style="font-size: 1.5rem; color: #007ad9;"></i>
              </div>

              <div *ngIf="!vendor.imageUrl && uploadingVendor !== vendor.id"
                   class="placeholder-avatar">
                <i class="pi pi-image"></i>
              </div>

            </div>
          </div>
        </td>
        <td>{{ vendor.name }}</td>
        <td>{{ vendor.street }}</td>
        <td>{{ vendor.cityState }}</td>
        <td>{{ vendor.zip }}</td>
        <td>{{ vendor.phone }}</td>
        <td>{{ vendor.shortName }}</td>
        <td>
          <p-tag [value]="vendor.onWeb" [styleClass]="vendor.onWeb === 'Yes' ? 'chip-members' : 'chip-clients'"></p-tag>
        </td>
        <td>
          <button pButton label="Toggle" icon="pi pi-refresh"
                  class="p-button-sm"
                  (click)="toggleWebStatus(vendor)">
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
