<!-- GLOBAL SEARCH INPUT -->
<p-confirmDialog header="Please Confirm" icon="pi pi-exclamation-triangle"></p-confirmDialog>

<div class="p-input-icon-left mb-2">
  <i class="pi pi-search"></i>
  <input type="text"
         pInputText
         placeholder="Search companies..."
          [(ngModel)]="globalFilterValue"
         (input)="filterTableGlobal($event, table)" />
</div>


<p-dropdown [options]="owners"
            optionLabel="name"
            optionValue="id"
            [(ngModel)]="selectedOwnerId"
            (onChange)="onOwnerFilter($event.value)"
            placeholder="Select Owner">
</p-dropdown>

<p-table #table
         [value]="companies"
         [paginator]="true"
         [rows]="10"
         [loading]="loading"
         [globalFilterFields]="['name', 'ownerName','accountNumber' ]"> 
         >
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="name">Company Name <p-sortIcon field="name" /></th>
      <th pSortableColumn="accountNumber">Account <p-sortIcon field="accountNumber" /></th>
      <th pSortableColumn="ownerName">Owner <p-sortIcon field="ownerName" /></th>

      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-company>
    <tr>

      <td>{{ company.name }}</td>
      <td>{{ company.accountNumber }}</td>

      <td>
        <div style="margin-bottom: 0.5rem;">{{ company.ownerName }}</div>
        <p-dropdown [options]="owners"
                    optionLabel="name"
                    optionValue="id"
                    [(ngModel)]="company.ownerId"
                    (onChange)="confirmUpdateOwner(company.id, $event.value)">
        </p-dropdown>


      </td>
      <td>
        <button pButton type="button" icon="pi pi-trash" class="p-button-danger p-button-sm"
                (click)="confirmDeleteCompany(company.id)">
        </button>
      </td>
    </tr>

  </ng-template>
</p-table>

<p-toast></p-toast>
