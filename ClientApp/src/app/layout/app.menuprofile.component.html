<div class="layout-menu-profile">
    <button class="p-link border-noround" (click)="toggleMenu()" pTooltip="Profile" [tooltipDisabled]="isTooltipDisabled">

      <img *ngIf="currentUser?.imageUrl && !photoFailed; else noAvatar" [src]="currentUser?.imageUrl" (error)="photoFailed = true" alt="avatar" style="width: 52px; height: 52px; object-fit: cover; border-radius: 50%;">
      <ng-template #noAvatar>
        <span class="piv2-avatar" aria-hidden="true">{{ (currentUser?.name || lastName || '?').trim().charAt(0).toUpperCase() }}</span>
      </ng-template>

      <span>
        <strong>{{ currentUser?.name }}</strong>
        <small>{{  currentUser?.title	 }}</small>
        <small>{{  currentUser?.department	 }}</small>

      </span>
        <i class="layout-menu-profile-toggler pi pi-fw" [ngClass]="{'pi-angle-down': menuProfilePosition === 'start' || isHorizontal, 'pi-angle-up': menuProfilePosition === 'end' && !isHorizontal}"></i>
    </button>

    <ul *ngIf="menuProfileActive" [@menu]="isHorizontal ? 'overlay' : 'inline'">
        <li pTooltip="Settings" [tooltipDisabled]="isTooltipDisabled">
            <button class="p-link" [routerLink]="['/profile/create']">
                <i class="pi pi-cog pi-fw"></i>
                <span>Settings</span>
            </button>
        </li>
        <li pTooltip="Profile" [tooltipDisabled]="isTooltipDisabled">
            <button class="p-link" [routerLink]="['/profile/list']">
                <i class="pi pi-file-o pi-fw"></i>
                <span>Profile</span>
            </button>
        </li>
        <li pTooltip="Support" [tooltipDisabled]="isTooltipDisabled">
            <button class="p-link" [routerLink]="['/documentation']">
                <i class="pi pi-compass pi-fw"></i>
                <span>Support</span>
            </button>
        </li>
        <li pTooltip="Logout" [tooltipDisabled]="isTooltipDisabled"   (click)="onLogoutClick()"  [routerLink]="['/auth/login']">
            <button class="p-link">
                <i class="pi pi-power-off pi-fw"></i>
                <span>Logout</span>
            </button>
        </li>
    </ul>
</div>
