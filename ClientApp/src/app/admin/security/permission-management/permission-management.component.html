<!-- Confirm Dialog -->
<p-toast></p-toast>

<!-- Header -->
<div class="flex flex-column md:flex-row justify-between items-start md:items-center mb-4 gap-3">
  <h2 class="text-xl font-semibold">🔐 Permissions Management</h2>
  <div class="flex gap-2">
    <button pButton label="New Permission" icon="pi pi-plus"
            class="p-button-sm"
            (click)="openCreateDialog()">
    </button>

    <button pButton label="Scan & Suggest Permissions" icon="pi pi-search"
            class="p-button-sm"
            (click)="scanRoutesForUnprotectedPermissions()">
    </button>
  </div>

</div>



<!-- Filters -->
<div class="flex flex-column md:flex-row gap-3 mb-3">
  <!-- Search -->
  <div class="w-full md:w-6">
    <label for="permSearchInput" class="block mb-1 text-sm font-semibold">Search Permissions</label>
    <div class="flex align-items-center gap-2 w-full">
      <span class="p-input-icon-left w-full">
        <i class="pi pi-search"></i>

        <input id="permSearchInput"
               pInputText
               [(ngModel)]="permissionSearchTerm"
               (ngModelChange)="applyPermissionFilter()"
               placeholder="Enter permission name or description"
               class="w-full" />

      </span>

      <button *ngIf="permissionSearchTerm"
              pButton
              icon="pi pi-times"
              class="p-button-sm p-button-text"
              (click)="permissionSearchTerm = ''; applyPermissionFilter()"
              title="Clear Search">
      </button>



    </div>
  </div>

  <!-- Sort -->
  <div class="w-full md:w-3">
    <label for="permSortDropdown" class="block mb-1 text-sm font-semibold">Sort By</label>
    <span class="p-input-icon-left w-full">
      <i class="pi pi-sort-alt"></i>
      <p-dropdown id="permSortDropdown"
                  [options]="permissionSortOptions"
                  [(ngModel)]="selectedPermissionSort"
                  (onChange)="applyPermissionFilter()"
                  placeholder="Sort"
                  class="w-full">
      </p-dropdown>
    </span>
  </div>
 </div>




  <!-- Table -->
  <p-table [value]="filteredPermissions" [paginator]="true" [rows]="10" class="shadow-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Permission Name</th>
        <th>Description</th>
        <th class="text-center">Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-perm>
      <tr>
        <td><strong>{{ perm.permissionName }}</strong></td>
        <td>{{ perm.description }}</td>
        <td class="text-center flex gap-2 justify-center">
          <button pButton icon="pi pi-pencil" class="p-button-sm p-button-rounded p-button-text" (click)="openEditDialog(perm)"></button>
          <button pButton icon="pi pi-trash" class="p-button-sm p-button-rounded p-button-text text-red-600" (click)="confirmDelete(perm)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>


  <!-- Create/Edit Dialog -->
  <p-dialog header="{{ editMode ? 'Edit Permission' : 'Create Permission' }}"
            [(visible)]="createDialogVisible"
            [modal]="true"
            [closable]="false"
            [style]="{ width: '28rem' }"
            [breakpoints]="{ '768px': '90vw' }">
    <div class="p-fluid text-sm">
      <div class="mb-3">
        <label for="permName" class="block mb-1 font-semibold">Permission Name</label>
        <input id="permName" pInputText [(ngModel)]="newPermission.name" class="w-full" />
      </div>
      <div class="mb-3">
        <label for="permDesc" class="block mb-1 font-semibold">Description</label>
        <textarea id="permDesc" pInputTextarea rows="3" [(ngModel)]="newPermission.description" class="w-full"></textarea>
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="createDialogVisible = false"></button>
        <button pButton label="Save" icon="pi pi-check" (click)="savePermission()" [disabled]="!newPermission.name.trim()"></button>
      </div>
    </div>
  </p-dialog>




  <p-dialog header="Suggest Permissions for Routes"
            [(visible)]="missingPermissionDialogVisible"
            [style]="{ width: '60vw' }"
            [modal]="true">



    <p-table [value]="unconfiguredRoutes">
      <ng-template pTemplate="header">
        <tr>
          <th>Route</th>
          <th>Permission Name</th>
          <th>Description</th>
          <th>Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row let-i="rowIndex">
        <tr>
          <td>{{ row.routePath }}</td> <!--  SHOW ROUTE HERE -->
          <td>
            <input [(ngModel)]="row.suggestedPermission" pInputText />
          </td>
          <td>
            <input [(ngModel)]="row.description" pInputText />
          </td>
          <td>
            <button pButton icon="pi pi-times"
                    class="p-button-sm p-button-text p-button-danger"
                    (click)="unconfiguredRoutes.splice(i, 1)">
            </button>
          </td>
        </tr>
      </ng-template>
    </p-table>


    <div class="flex justify-end mt-3 gap-2">
      <button pButton label="Cancel" class="p-button-text" (click)="missingPermissionDialogVisible = false"></button>
      <button pButton label="Create Selected Permissions"
              icon="pi pi-check"
              (click)="createSuggestedPermissions()">
      </button>
    </div>
  </p-dialog>
