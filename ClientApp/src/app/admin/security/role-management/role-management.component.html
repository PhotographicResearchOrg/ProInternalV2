<!-- Confirm Dialog -->
<p-toast></p-toast>

<!-- Header -->
<div class="flex flex-column md:flex-row justify-between items-start md:items-center mb-4 gap-3">
  <h2 class="text-xl font-semibold">🎭 Roles Management</h2>
  <div class="w-full md:w-auto flex justify-end">
    <button pButton
            label="New Role"
            icon="pi pi-plus"
            class="p-button-sm"
            (click)="createRoleDialog = true">
    </button>
  </div>
</div>

<!-- Filters -->
<div class="flex flex-column md:flex-row gap-3 mb-3">
  <!-- Search -->
  <div class="w-full md:w-4">
    <label for="roleSearchInput" class="block mb-1 text-sm font-semibold">Search Roles</label>
    <div class="flex align-items-center gap-2 w-full">
      <span class="p-input-icon-left w-full">
        <i class="pi pi-search"></i>
        <input id="roleSearchInput"
               pInputText
               [(ngModel)]="roleSearchTerm"
               (ngModelChange)="applyRoleFilters()"
               placeholder="       Enter role name"
               class="w-full" />
      </span>
      <button *ngIf="roleSearchTerm"
              pButton
              icon="pi pi-times"
              class="p-button-sm p-button-text"
              (click)="roleSearchTerm = ''; applyRoleFilters()"
              title="Clear Search">
      </button>
    </div>
  </div>

  <!-- Sort -->
  <div class="w-full md:w-3">
    <label for="sortDropdown" class="block mb-1 text-sm font-semibold">Sort By</label>
    <span class="p-input-icon-left w-full">
      <i class="pi pi-sort-alt"></i>
      <p-dropdown id="sortDropdown"
                  [options]="sortOptions"
                  [(ngModel)]="selectedSort"
                  (onChange)="applyRoleFilters()"
                  placeholder="Sort"
                  class="w-full">
      </p-dropdown>
    </span>
  </div>




  <!-- Role Filter -->
  <div class="w-full md:w-5">
    <label for="roleFilter" class="block mb-1 text-sm font-semibold">Filter by Role</label>
    <div class="flex align-items-center gap-2">
      <p-multiSelect id="roleFilter"
                     [options]="roleFilterOptions"
                     [(ngModel)]="selectedRoleFilter"
                     (onChange)="applyRoleFilters()"
                     optionLabel="label"
                     optionValue="value"
                     display="chip"
                     placeholder="Select roles"
                     class="w-full min-w-[16rem]">
      </p-multiSelect>
      <button pButton icon="pi pi-times"
              class="p-button-sm p-button-rounded p-button-text"
              (click)="clearRoleFilter()"
              title="Clear Role Filter">
      </button>
    </div>
  </div>
</div>



<!-- Roles List -->
<div class="grid -mx-2">
  <div *ngFor="let role of filteredRoles" class="col-12 md:col-6 lg:col-4">
    <div class="p-3 surface-card border-round shadow-1 h-full cursor-pointer hover:shadow"
         (click)="handleRoleClick(role.value, $event)"
         [ngClass]="{ 'border-blue-300 bg-blue-50': role.value === selectedRole }"
         pTooltip="Click to edit permissions"
         tooltipPosition="top">

      <!-- Top Row: Name + Description -->
      <div class="flex justify-content-between align-items-start mb-2">
        <div class="w-full">
          <ng-container *ngIf="renameMode === role.value; else roleLabel">
            <input pInputText
                   [(ngModel)]="renameInput"
                   (click)="$event.stopPropagation()"
                   class="text-sm w-full font-semibold" />
          </ng-container>

          <ng-template #roleLabel>
            <div class="text-md font-semibold text-900 truncate">{{ role.label }}</div>
          </ng-template>

          <div *ngIf="role.description"
               class="text-sm text-color-secondary truncate"
               title="{{ role.description }}">
            {{ role.description }}
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-end gap-2 mt-3">
        <ng-container *ngIf="renameMode === role.value; else defaultButtons">
          <button pButton icon="pi pi-check"
                  class="p-button-sm p-button-text p-button-rounded text-green-600"
                  (click)="renameRoleConfirmed(role.value); $event.stopPropagation()">
          </button>
          <button pButton icon="pi pi-times"
                  class="p-button-sm p-button-text p-button-rounded"
                  (click)="cancelRename(); $event.stopPropagation()">
          </button>
        </ng-container>

        <ng-template #defaultButtons>
          <button pButton icon="pi pi-pencil"
                  class="p-button-sm p-button-text p-button-rounded"
                  (click)="openRenameRole(role.value); $event.stopPropagation()">
          </button>
          <button pButton icon="pi pi-trash"
                  class="p-button-sm p-button-text p-button-rounded text-red-600"
                  (click)="confirmDeleteRole(role.value); $event.stopPropagation()">
          </button>
        </ng-template>
      </div>
    </div>
  </div>
</div>



<!-- Sidebar: Edit Role Permissions -->
<p-sidebar [(visible)]="showEditSidebar"
           position="right"
           [style]="{ width: isMobile ? '100%' : '60%' }"
           [modal]="true">
  <div class="p-fluid">
    <h3>Edit Role: {{ selectedRole }}</h3>

    <label class="block mb-2 mt-3 font-semibold">Permissions</label>
    <p-pickList [source]="availablePermissions"
                [target]="rolePermissions"
                [dragdrop]="true"
                sourceHeader="Available Permissions"
                targetHeader="Assigned Permissions"
                [showSourceControls]="false"
                [showTargetControls]="false"
                [responsive]="false"
                (onMoveToTarget)="onPermissionsUpdated()"
                (onMoveToSource)="onPermissionsUpdated()">


      <!--
        <ng-template let-role pTemplate="item">
        <div class="w-full">
          <div class="flex flex-col leading-tight">
            <span class="font-medium">{{ role.permissionName }}</span>
            <span class="text-xs text-gray-500">{{ role.description }}</span>
          </div>
        </div>
      </ng-template>
        -->

      <ng-template let-role pTemplate="item">
        <span class="font-medium"
              pTooltip="{{ role.description }}"
              tooltipPosition="top">
          {{ role.permissionName }}
        </span>
      </ng-template>


    </p-pickList>

    <div class="mt-4 flex justify-end gap-2">
      <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="showEditSidebar = false"></button>
      <button pButton label="Save" icon="pi pi-check" (click)="saveRolePermissions()"></button>
    </div>
  </div>
</p-sidebar>

<!-- Create Role Dialog -->
<p-dialog header="Create New Role"
          [(visible)]="createRoleDialog"
          [modal]="true"
          [closable]="false"
          [style]="{ width: '28rem' }"
          [breakpoints]="{ '768px': '90vw' }"
          class="rounded-xl shadow-md text-sm">

  <div class="p-fluid text-sm">
    <!-- Role Name -->
    <div class="mb-4">
      <label for="newRoleName" class="block mb-1 font-semibold">Role Name <span class="text-red-500">*</span></label>
      <input id="newRoleName"
             pInputText
             [(ngModel)]="newRoleName"
             placeholder="Enter role name"
             class="w-full" />
    </div>

    <!-- Role Description -->
    <div class="mb-4">
      <label for="newRoleDescription" class="block mb-1 font-semibold">Description</label>
      <textarea id="newRoleDescription"
                pInputTextarea
                rows="3"
                [(ngModel)]="newRoleDescription"
                placeholder="Optional role description"
                class="w-full">
      </textarea>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-2 pt-2">
      <button pButton
              label="Cancel"
              icon="pi pi-times"
              class="p-button-text text-sm"
              (click)="createRoleDialog = false">
      </button>

      <button pButton
              label="Create"
              icon="pi pi-check"
              class="text-sm"
              [disabled]="!newRoleName?.trim()"
              (click)="createRole()">
      </button>
    </div>
  </div>
</p-dialog>
